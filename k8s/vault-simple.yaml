apiVersion: v1
kind: Namespace
metadata:
  name: vault
---
apiVersion: v1
kind: Service
metadata:
  name: vault
  namespace: vault
spec:
  selector:
    app: vault
  ports:
    - port: 8200
      targetPort: 8200
---
apiVersion: v1
kind: Pod
metadata:
  name: vault
  namespace: vault
  labels:
    app: vault
spec:
  containers:
    - name: vault
      image: hashicorp/vault:latest
      imagePullPolicy: IfNotPresent
      args:
        - "server"
        - "-dev"
        - "-dev-root-token-id=root"
        - "-dev-listen-address=0.0.0.0:8200"
      env:
        - name: VAULT_DEV_ROOT_TOKEN_ID
          value: "root"
      ports:
        - containerPort: 8200
      readinessProbe:
        httpGet:
          path: /v1/sys/health
          port: 8200
        initialDelaySeconds: 5
        periodSeconds: 5
