replicaCount: 3

image:
  tag: stable

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

configEnv:
  APP_NAME: "DevOps Info Service"
  ENVIRONMENT: "production"
  FEATURE_VISITS: "true"
  FEATURE_METRICS: "true"
  LOG_FORMAT: "json"
  METRICS_PORT: "8000"
  DEBUG_MODE: "false"

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 500m
    memory: 512Mi

priorityClassName: high-priority

persistence:
  enabled: true
  size: 1Gi
  accessMode: ReadWriteOnce
  storageClass: "managed-premium"
  annotations:
    backup.kubernetes.io/enabled: "true"
  mountPath: /data

canary:
  enabled: true
  strategy:
    canary:
      steps:
        - setWeight: 5
        - pause: {}
        - setWeight: 25
        - pause:
            duration: 60s
        - setWeight: 50
        - pause:
            duration: 60s
        - setWeight: 75
        - pause:
            duration: 30s
        - setWeight: 100
