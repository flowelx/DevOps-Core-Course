replicaCount: 3

image:
  repository: nginx
  tag: stable
  pullPolicy: IfNotPresent

serviceAccount: 
  create: false
  annotations: {}
  name: ""

httpRoute:
  enabled: false
  hostnames: []
  parentRefs: []
  rules: []

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

livenessProbe:
  enabled: true
  httpGet:
    path: /health
    port: 80
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  enabled: true
  httpGet:
    path: /ready
    port: 80
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  successThreshold: 1
  failureThreshold: 3

service:
  type: ClusterIP
  port: 80
  targetPort: 80

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

env:
  - name: APP_MODE
    value: "production"
  - name: LOG_LEVEL
    value: "info"

secrets:
  enabled: true
  annotations: {}
  data: {}
  
  stringData:
    DB_USERNAME: "app_user"
    DB_PASSWORD: "default_password"
    API_KEY: "default_api_key_12345"
    SECRET_KEY: "default_secret_key"

configMap:
  enabled: true
  mountPath: /config/config.json
  subPath: config.json

configEnv:
  APP_NAME: "DevOps Info Service"
  ENVIRONMENT: "production"
  FEATURE_VISITS: "true"
  FEATURE_METRICS: "true"
  LOG_FORMAT: "json"
  METRICS_PORT: "8000"

persistence:
  enabled: true
  annotations: {}
  size: 100Mi
  accessMode: ReadWriteOnce
  storageClass: ""
  mountPath: /data

canary:
  enabled: true
  
  strategy:
    canary:
      steps:      
        - setWeight: 20
        - pause: {}
        - setWeight: 40
        - pause: 
            duration: 30s
        - setWeight: 60
        - pause: 
            duration: 30s
        - setWeight: 80
        - pause: 
            duration: 30s      
        - setWeight: 100
      
  revisionHistoryLimit: 10
  
production:
  canary:
    enabled: true
    strategy:
      canary:
        steps:
          - setWeight: 10
          - pause: 
              duration: 10s
          - setWeight: 30
          - pause: 
              duration: 10s
          - setWeight: 60
          - pause: 
              duration: 10s
          - setWeight: 100
