        {{- end }}
        {{- if .Values.configEnv }}
        envFrom:
        - configMapRef:
            name: {{ include "myapp.fullname" . }}-env
        {{- end }}
        volumeMounts:
        {{- if .Values.configMap.enabled }}
        - name: config
          mountPath: {{ .Values.configMap.mountPath }}
