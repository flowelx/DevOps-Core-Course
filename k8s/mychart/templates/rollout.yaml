{{- if .Values.canary.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ include "myapp.fullname" . }}
  labels:
    {{- include "myapp.labels" . | nindent 4 }}
    {{- if .Values.additionalLabels }}
    {{- toYaml .Values.additionalLabels | nindent 4 }}
    {{- end }}
spec:
  replicas: {{ .Values.replicaCount }}
  
  strategy:
    canary:
      steps:
        {{- toYaml .Values.canary.steps | nindent 8 }}
  
  revisionHistoryLimit: {{ .Values.canary.revisionHistoryLimit | default 10 }}
  
  selector:
    matchLabels:
      {{- include "myapp.selectorLabels" . | nindent 6 }}
  
  template:
    metadata:
      labels:
        {{- include "myapp.selectorLabels" . | nindent 8 }}
        {{- if .Values.additionalLabels }}
        {{- toYaml .Values.additionalLabels | nindent 8 }}
        {{- end }}
    spec:
      {{- if .Values.priorityClassName }}
      priorityClassName: {{ .Values.priorityClassName }}
      {{- end }}
      {{- if .Values.affinity }}
      affinity:
        {{- toYaml .Values.affinity | nindent 8 }}
      {{- end }}
      containers:
      - name: {{ .Chart.Name }}
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - containerPort: {{ .Values.service.port }}
          name: http
          protocol: TCP
        
        {{- if or .Values.secrets.enabled .Values.env .Values.configEnv }}
        env:
          {{- if .Values.secrets.enabled }}
          {{- range $key, $value := .Values.secrets.stringData }}
          - name: {{ $key }}
            valueFrom:
              secretKeyRef:
                name: {{ include "myapp.fullname" $ }}-secret
                key: {{ $key }}
          {{- end }}
          {{- end }}
          {{- if .Values.env }}
          {{- toYaml .Values.env | nindent 10 }}
          {{- end }}
        {{- end }}
        
        {{- if .Values.configEnv }}
        envFrom:
        - configMapRef:
            name: {{ include "myapp.fullname" . }}-env
        {{- end }}
        
        volumeMounts:
        {{- if .Values.configMap.enabled }}
        - name: config
          mountPath: {{ .Values.configMap.mountPath }}
          subPath: {{ .Values.configMap.subPath }}
        {{- end }}
        {{- if .Values.persistence.enabled }}
        - name: data
          mountPath: {{ .Values.persistence.mountPath }}
        {{- end }}
        
        {{- if .Values.livenessProbe.enabled }}
        livenessProbe:
          httpGet:
            path: {{ .Values.livenessProbe.httpGet.path }}
            port: {{ .Values.livenessProbe.httpGet.port }}
          initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
          periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
          timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}
          failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
        {{- end }}
        
        {{- if .Values.readinessProbe.enabled }}
        readinessProbe:
          httpGet:
            path: {{ .Values.readinessProbe.httpGet.path }}
            port: {{ .Values.readinessProbe.httpGet.port }}
          initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
          periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
          timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds }}
          successThreshold: {{ .Values.readinessProbe.successThreshold }}
          failureThreshold: {{ .Values.readinessProbe.failureThreshold }}
        {{- end }}
        
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
      
      volumes:
      {{- if .Values.configMap.enabled }}
      - name: config
        configMap:
          name: {{ include "myapp.fullname" . }}-config
      {{- end }}
      {{- if .Values.persistence.enabled }}
      - name: data
        persistentVolumeClaim:
          claimName: {{ include "myapp.fullname" . }}-data
      {{- end }}
{{- else }}
# Fallback to standard Deployment if canary is disabled
apiVersion: apps/v1
kind: Deployment
metadata:
