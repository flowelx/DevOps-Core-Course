{{- if and .Values.blueGreen.enabled (not .Values.canary.enabled) }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.blueGreen.activeService }}
  labels:
    {{- include "myapp.labels" . | nindent 4 }}
    service-type: active
spec:
  selector:
    {{- include "myapp.selectorLabels" . | nindent 4 }}
  ports:
  - port: {{ .Values.service.port }}
    targetPort: {{ .Values.service.targetPort }}
    protocol: TCP
  type: {{ .Values.service.type }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.blueGreen.previewService }}
  labels:
    {{- include "myapp.labels" . | nindent 4 }}
    service-type: preview
spec:
  selector:
    {{- include "myapp.selectorLabels" . | nindent 4 }}
  ports:
  - port: {{ .Values.service.port }}
    targetPort: {{ .Values.service.targetPort }}
    protocol: TCP
  type: {{ .Values.service.type }}
{{- end }}
