global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'devops-monitoring'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'monitoring'
          component: 'prometheus'

  - job_name: 'app'
    static_configs:
      - targets: ['python-app:5000']
        labels:
          service: 'application'
          app: 'devops-python'
    metrics_path: /metrics
    scrape_interval: 10s
    scrape_timeout: 5s

  - job_name: 'loki'
    static_configs:
      - targets: ['loki:3100']
        labels:
          service: 'logging'
          component: 'loki'
    metrics_path: /metrics
    scrape_interval: 15s

  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']
        labels:
          service: 'visualization'
          component: 'grafana'
    metrics_path: /metrics
    scrape_interval: 15s
